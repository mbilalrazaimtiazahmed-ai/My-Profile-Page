<!DOCTYPE html>
<html>
<head><title>Student Registration Form</title></head>
<body><center>
    <table width="80%" border="1" cellpadding="10">
        <tr bgcolor="#E6E6FA"><td>Home</td><td>About Us</td><td>Courses</td><td>Students</td><td>Registration</td><td>Contact</td></tr>
    </table>
    <h3>Student Registration Form</h3>
    <form>
    <table width="60%" border="1" cellpadding="10">
        <tr><td>Full Name:</td><td><input type="text" placeholder="Enter your full name"></td></tr>
        <tr><td>Email:</td><td><input type="email" placeholder="Enter your email"></td></tr>
        <tr><td>Password:</td><td><input type="password" placeholder="Enter password (min 6 characters)"></td></tr>
        <tr><td>Contact Number:</td><td><input type="number" placeholder="Enter your contact number"></td></tr>
        <tr><td>Gender:</td><td><input type="radio" name="gender"> Male <input type="radio" name="gender"> Female <input type="radio" name="gender"> Other</td></tr>
        <tr><td>Select Courses:</td><td><input type="checkbox"> HTML <input type="checkbox"> CSS <input type="checkbox"> JavaScript <input type="checkbox"> Python</td></tr>
        <tr><td>Address:</td><td><textarea rows="4" placeholder="Enter your address here"></textarea></td></tr>
        <tr><td colspan="2"><center><input type="submit" value="Submit"></center></td></tr>
    </table>
    </form>
    <table width="80%" bgcolor="#E6E6FA"><tr><td>© 2026 Future Institute. All Rights Reserved.</td></tr></table>
    <p><b>registration.html</b></p>
</center></body>
</html>
